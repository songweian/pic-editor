name: pic_editor
description: 多端纸张排版图片编辑器原型
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  provider: 6.1.1
  file_picker: 6.1.1
  image_picker: 1.0.7
  image: 4.1.4
  path_provider: 2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
